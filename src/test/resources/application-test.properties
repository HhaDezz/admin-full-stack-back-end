# Tests run against a real PostgreSQL database (the audit log uses PostgreSQL features).
# Create it once:  createdb atelier_test   (or set TEST_DB_URL / TEST_DB_USERNAME / TEST_DB_PASSWORD)
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/atelier_test}
spring.datasource.username=${TEST_DB_USERNAME:atelier}
spring.datasource.password=${TEST_DB_PASSWORD:atelier}
app.jwt.secret=test-secret-test-secret-test-secret-0123456789
app.bootstrap.admin-email=root@test.local
app.bootstrap.admin-password=RootPassword1!
app.bootstrap.demo-users=false
app.security.max-login-attempts=3
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.registration.enabled=true
app.registration.require-verification=true
app.web-url=http://web.test
# Many sign-ups from one IP in a few seconds: switch the per-IP limits off for tests.
app.security.rate-limits=false
