# Runs the whole product: PostgreSQL + API + web app.
# Expects the web app (atelier-admin) in ../atelier-admin. Usage:
#   cp .env.example .env    (then set JWT_SECRET and ADMIN_PASSWORD)
#   docker compose up -d --build
#   open http://localhost:8081
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atelier
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: ${DB_PASSWORD:-atelier}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier -d atelier"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/atelier
      DB_USERNAME: atelier
      DB_PASSWORD: ${DB_PASSWORD:-atelier}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      DEMO_USERS: ${DEMO_USERS:-false}
      # Links in emails (confirm address, reset password) point here.
      WEB_URL: ${WEB_URL:-http://localhost:8081}
      BRAND_NAME: ${APP_NAME:-Anjana}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      REGISTRATION_REQUIRE_VERIFICATION: ${REGISTRATION_REQUIRE_VERIFICATION:-true}
      # Leave MAIL_HOST empty to write emails to the API log instead of sending them.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.com}
    ports:
      - "8089:8089"

  web:
    build:
      context: ../atelier-admin
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8089}
        VITE_APP_NAME: ${APP_NAME:-Anjana}
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  db-data:
